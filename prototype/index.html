<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BayiOS — Dealer Operations</title>
  <style>
    :root{--ink:#172033;--muted:#6d7890;--line:#e7eaf0;--paper:#f7f8fb;--card:#fff;--brand:#4355d8;--brand-soft:#eef0ff;--green:#16845b;--green-soft:#e8f7f0;--amber:#a56512;--amber-soft:#fff5df;--red:#bd4450;--red-soft:#fff0f1;--shadow:0 12px 30px rgba(31,42,70,.07)}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0}
    .app{display:flex;min-height:100vh}.sidebar{width:242px;background:#fff;border-right:1px solid var(--line);padding:24px 16px;flex-shrink:0}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;padding:0 12px 28px}.brand-mark{display:grid;place-items:center;width:34px;height:34px;background:var(--brand);color:#fff;border-radius:11px;font-size:16px}.nav{display:grid;gap:5px}.nav button{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;background:transparent;color:var(--muted);text-align:left}.nav button:hover,.nav button.active{background:var(--brand-soft);color:var(--brand);font-weight:700}.nav-icon{width:20px;text-align:center}.sidebar-note{margin:32px 8px 0;padding:14px;border:1px solid var(--line);border-radius:14px;color:var(--muted);font-size:12px}.main{min-width:0;flex:1}.topbar{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;gap:20px}.search{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid transparent;border-radius:10px;padding:9px 13px;width:min(420px,50vw)}.search:focus-within{border-color:var(--brand)}.search input{border:0;outline:0;background:transparent;width:100%;color:var(--ink)}.user-chip{display:flex;align-items:center;gap:10px;color:var(--muted)}.avatar{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#dfe3ff;color:var(--brand);font-weight:700}.content{max-width:1440px;margin:auto;padding:34px}.eyebrow{color:var(--brand);font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.08em}.heading{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:25px}.heading h1{font-size:30px;line-height:1.15;margin:5px 0 0;letter-spacing:-.03em}.heading p{color:var(--muted);margin:7px 0 0}.btn{border-radius:9px;padding:10px 15px;background:var(--brand);color:#fff;font-weight:700}.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.ghost{background:transparent;color:var(--brand);padding:7px 0}.grid{display:grid;gap:18px}.metrics{grid-template-columns:repeat(4,1fr);margin-bottom:28px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:20px}.metric-label{color:var(--muted);font-size:13px}.metric-value{font-size:27px;font-weight:800;margin:8px 0 3px}.trend{font-size:12px;color:var(--green)}.dashboard-grid{grid-template-columns:1.35fr 1fr}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.section-title h2{font-size:17px;margin:0}.section-title span{font-size:12px;color:var(--muted)}.queue{display:grid;gap:10px}.queue-item{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}.queue-item:last-child{border-bottom:0}.queue-item strong{display:block;font-size:13px}.queue-item small{color:var(--muted)}.status{display:inline-flex;align-items:center;white-space:nowrap;border-radius:99px;padding:4px 9px;font-size:11px;font-weight:800}.status.green{background:var(--green-soft);color:var(--green)}.status.amber{background:var(--amber-soft);color:var(--amber)}.status.red{background:var(--red-soft);color:var(--red)}.status.blue{background:var(--brand-soft);color:var(--brand)}.product-grid{grid-template-columns:repeat(3,1fr)}.product-card{display:flex;flex-direction:column;gap:16px}.product-image{height:120px;border-radius:12px;background:linear-gradient(135deg,#f1f3ff,#e7eaff);display:grid;place-items:center;color:#8b96dc;font-size:42px}.product-card h3{margin:0;font-size:16px}.product-meta{color:var(--muted);font-size:12px}.price-row{display:flex;align-items:end;justify-content:space-between}.price{font-size:20px;font-weight:800}.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}table{width:100%;border-collapse:collapse;min-width:680px}th,td{text-align:left;padding:15px 18px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:12px;font-weight:700;background:#fcfcfd}tr:last-child td{border-bottom:0}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.toolbar input,.toolbar select,.form-field input,.form-field select{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:#fff;color:var(--ink);outline:0}.toolbar input{flex:1;min-width:200px}.toolbar input:focus,.form-field input:focus{border-color:var(--brand)}.flow{display:flex;align-items:center;gap:0;margin:7px 0 25px}.step{display:flex;align-items:center;color:var(--muted);font-size:12px}.step i{display:grid;place-items:center;width:27px;height:27px;border-radius:50%;font-style:normal;border:1px solid var(--line);margin-right:7px}.step.done{color:var(--green)}.step.done i{background:var(--green);color:white;border-color:var(--green)}.step.current{color:var(--brand);font-weight:700}.step.current i{background:var(--brand);color:white;border-color:var(--brand)}.connector{height:1px;background:var(--line);width:35px;margin:0 8px}.empty{padding:45px;text-align:center;color:var(--muted)}.notice{padding:12px 14px;border-radius:10px;background:var(--green-soft);color:var(--green);margin-bottom:18px;font-weight:600}.hidden{display:none!important}.modal-backdrop{position:fixed;inset:0;background:rgba(18,25,45,.4);display:grid;place-items:center;padding:20px;z-index:5}.modal{background:#fff;border-radius:18px;width:min(560px,100%);box-shadow:0 25px 70px rgba(0,0,0,.2);padding:24px}.modal-head{display:flex;justify-content:space-between;align-items:start}.modal h2{margin:0 0 5px}.close{background:transparent;color:var(--muted);font-size:22px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:22px 0}.form-field{display:grid;gap:6px}.form-field.full{grid-column:1/-1}.form-field label{font-size:12px;color:var(--muted);font-weight:700}.modal-actions{display:flex;justify-content:flex-end;gap:10px}.stock-highlight{display:flex;align-items:center;justify-content:space-between;padding:15px;border-radius:12px;background:var(--brand-soft);margin:15px 0}.stock-highlight strong{font-size:24px;color:var(--brand)}.footer-note{margin-top:24px;color:var(--muted);font-size:12px}
    @media(max-width:900px){.sidebar{width:72px;padding:20px 10px}.brand{padding:0 8px 25px}.brand span,.nav button span,.sidebar-note{display:none}.nav button{justify-content:center}.topbar{padding:0 20px}.content{padding:25px 20px}.metrics{grid-template-columns:repeat(2,1fr)}.dashboard-grid{grid-template-columns:1fr}.product-grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:560px){.topbar{height:auto;align-items:stretch;flex-direction:column;padding:14px 16px;gap:10px}.search{width:100%}.user-chip{justify-content:flex-end}.content{padding:22px 15px}.heading{align-items:start;flex-direction:column}.heading h1{font-size:25px}.metrics{grid-template-columns:1fr 1fr;gap:10px}.card{padding:15px}.metric-value{font-size:22px}.product-grid{grid-template-columns:1fr}.flow{overflow:auto;padding-bottom:5px}.step{flex-shrink:0}.connector{width:20px}.form-grid{grid-template-columns:1fr}.form-field.full{grid-column:auto}.modal{padding:18px}}
    @media print{.sidebar,.topbar,.btn,.toolbar,.footer-note{display:none!important}.main{width:100%}.content{padding:0}.card,.table-wrap{box-shadow:none;border:1px solid #bbb}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">B</div><span>BayiOS</span></div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-note">Yerel ağ prototipi<br><strong>Mock oturum açık</strong></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <label class="search">⌕ <input id="globalSearch" placeholder="Ürün, marka veya barkod ara..." aria-label="Ürün ara"></label>
        <div class="user-chip"><span>Bugün, 5 Kasım 2026</span><div class="avatar">BO</div></div>
      </header>
      <section class="content" id="view"></section>
    </main>
  </div>
  <div id="modalRoot"></div>
  <script>
    const products = [
      {id:1,name:"Beyaz Seri 9 kg Çamaşır Makinesi",sku:"WM-9001",brand:"BayiHome",price:"24.999 TL",stock:5,reserved:2,icon:"▣"},
      {id:2,name:"FreshCool No-Frost Buzdolabı",sku:"RF-2204",brand:"FreshCool",price:"31.500 TL",stock:8,reserved:1,icon:"▤"},
      {id:3,name:"Vista 55\" 4K Smart TV",sku:"TV-5508",brand:"Vista",price:"18.750 TL",stock:3,reserved:0,icon:"▥"},
      {id:4,name:"ProChef Ankastre Fırın",sku:"OV-1102",brand:"ProChef",price:"12.400 TL",stock:7,reserved:3,icon:"▦"},
      {id:5,name:"AirFlow Inverter Klima",sku:"AC-1807",brand:"AirFlow",price:"27.900 TL",stock:2,reserved:1,icon:"◉"},
      {id:6,name:"CleanBot Akıllı Süpürge",sku:"VC-3011",brand:"CleanBot",price:"9.999 TL",stock:11,reserved:0,icon:"◌"}
    ];
    let reservations = [
      {id:"RZ-1042",customer:"Yıldız Ailesi",product:"Beyaz Seri 9 kg Çamaşır Makinesi",status:"Depo hazır",date:"05 Kas"},
      {id:"RZ-1041",customer:"Nehir Ofis",product:"FreshCool No-Frost Buzdolabı",status:"Servis atandı",date:"06 Kas"},
      {id:"RZ-1038",customer:"Mert Kaya",product:"Vista 55\" 4K Smart TV",status:"Teslim edildi",date:"04 Kas"}
    ];
    const navItems = [["home","⌂","Ana Sayfa"],["products","▦","Ürünler"],["campaigns","%","Kampanyalar"],["offers","☷","Teklifler"],["reservations","◷","Rezervasyonlar"],["stock","▤","Stok / Sayım"],["quick","⌁","Hızlı Teslim"],["settings","⚙","Ayarlar"]];
    let active = "home", productFilter = "";
    const nav = document.getElementById("nav"), view = document.getElementById("view");
    nav.innerHTML = navItems.map(([id,icon,label]) => `<button data-page="${id}"><span class="nav-icon">${icon}</span><span>${label}</span></button>`).join("");
    nav.addEventListener("click", e => { const btn=e.target.closest("[data-page]"); if(btn) render(btn.dataset.page); });
    document.getElementById("globalSearch").addEventListener("input", e => { productFilter=e.target.value.toLowerCase(); render("products"); });
    function shell(title, subtitle, action=""){ return `<div class="heading"><div><div class="eyebrow">BayiOS / ${title}</div><h1>${title}</h1><p>${subtitle}</p></div>${action}</div>`; }
    function render(page=active){
      active=page; document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));
      const pages={home:home,products:productsPage,campaigns:campaigns,offers:offers,reservations:reservationPage,stock:stock,quick:quick,settings:settings};
      view.innerHTML=(pages[page]||home)(); attachPageEvents();
    }
    function home(){
      return shell("Ana Sayfa","Bugünün satış ve teslimat akışını tek bakışta yönetin.","<button class=\"btn\" data-action=\"new-offer\">+ Yeni teklif</button>")+
      `<div class="grid metrics"><div class="card\"><div class="metric-label">Bugünkü teklifler</div><div class="metric-value">12</div><div class="trend">↗ %18 geçen haftaya göre</div></div><div class="card\"><div class="metric-label">Açık rezervasyon</div><div class="metric-value">24</div><div class="trend">7'si bu hafta teslim</div></div><div class="card\"><div class="metric-label">Satılabilir ürün</div><div class="metric-value">186</div><div class="trend">↗ 8 yeni giriş</div></div><div class="card\"><div class="metric-label">Aktif kampanya</div><div class="metric-value">5</div><div class="trend">2'si yarın bitiyor</div></div></div>
      <div class="grid dashboard-grid"><div class="card"><div class="section-title"><h2>Operasyon kuyruğu</h2><span>Son güncelleme: şimdi</span></div><div class="queue">${reservations.slice(0,3).map(r=>`<div class="queue-item"><div><strong>${r.id} · ${r.customer}</strong><small>${r.product}</small></div><span class="status ${r.status==="Teslim edildi"?"green":"amber"}">${r.status}</span></div>`).join("")}</div><button class="btn ghost" data-page="reservations">Tüm rezervasyonları gör →</button></div>
      <div class="card"><div class="section-title"><h2>Stok görünümü</h2><span>6 ürün seçili</span></div><div class="stock-highlight"><div><small>En düşük satılabilir</small><br><strong>1 adet</strong></div><span class="status red">Dikkat</span></div><div class="queue">${products.slice(0,3).map(p=>`<div class="queue-item"><div><strong>${p.name.split(" ").slice(0,3).join(" ")}</strong><small>${p.sku}</small></div><span>${p.stock-p.reserved} satılabilir</span></div>`).join("")}</div></div></div>`;
    }
    function productsPage(){
      const filtered=products.filter(p=>(p.name+" "+p.sku+" "+p.brand).toLowerCase().includes(productFilter));
      return shell("Ürünler","Fiyat, kampanya ve stok durumunu inceleyin.","<button class=\"btn\" data-action=\"new-offer\">Teklif oluştur</button>")+`<div class="toolbar"><input id="productFilter" value="${productFilter}" placeholder="Ürün adı, SKU veya marka filtrele"><select><option>Tüm stok durumları</option><option>Satılabilir düşük</option><option>Stokta</option></select></div><div class="grid product-grid">${filtered.length?filtered.map(productCard).join(""):`<div class="card empty">Aramanızla eşleşen ürün bulunamadı.</div>`}</div>`;
    }
    function productCard(p){return `<article class="card product-card"><div class="product-image">${p.icon}</div><div><div class="product-meta">${p.brand} · ${p.sku}</div><h3>${p.name}</h3></div><div class="price-row"><div><div class="product-meta">Normal fiyat</div><div class="price">${p.price}</div></div><span class="status ${p.stock-p.reserved<2?"red":"green"}">${p.stock-p.reserved} satılabilir</span></div><button class="btn secondary" data-product="${p.id}">Detayı gör</button></article>`}
    function campaigns(){return shell("Kampanyalar","Aktif ve planlanan kampanyaları tarihe göre yönetin.","<button class=\"btn\">+ Kampanya ekle</button>")+`<div class="grid dashboard-grid"><div class="card"><div class="section-title"><h2>Aktif kampanyalar</h2><span>5 kampanya</span></div><div class="queue">${["Beyaz eşya kış fırsatı","Peşin alım avantajı","Yeni ev paketi","Kasım teknoloji günleri"].map((x,i)=>`<div class="queue-item"><div><strong>${x}</strong><small>${i+1}–30 Kasım 2026 · ${i+10}% avantaj</small></div><span class="status green">Aktif</span></div>`).join("")}</div></div><div class="card"><div class="section-title"><h2>Yaklaşan bitişler</h2></div><div class="empty">Kampanya snapshot geçmişi burada görünür.</div></div></div>`}
    function offers(){return shell("Teklifler","Katalogdaki ürünleri checkbox ile çoklu seçin; miktar ve teklif fiyatlarını girip mevcut müşteriyi seçin.","<button class=\"btn\" data-action=\"new-offer\">+ Yeni teklif</button>")+`<div class="table-wrap"><table><thead><tr><th>Teklif</th><th>Müşteri</th><th>Ürünler</th><th>Tutar</th><th>Durum</th><th></th></tr></thead><tbody>${[["TK-2048","Yıldız Ailesi","3 ürün","68.249 TL","Bekliyor"],["TK-2047","Nehir Ofis","5 ürün","112.800 TL","Kabul edildi"],["TK-2046","Mert Kaya","1 ürün","18.750 TL","Reddedildi"]].map(x=>`<tr><td><strong>${x[0]}</strong></td><td>${x[1]}</td><td>${x[2]}</td><td>${x[3]}</td><td><span class="status ${x[4]==="Kabul edildi"?"green":x[4]==="Reddedildi"?"red":"amber"}">${x[4]}</span></td><td><button class="btn ghost" data-action="new-offer">Aç</button></td></tr>`).join("")}</tbody></table></div>`}
    function reservationPage(){return shell("Rezervasyonlar","Teslimatın her adımını takip edin.","<button class=\"btn\" data-action=\"new-offer\">Tekliften rezervasyon</button>")+`<div class="card"><div class="section-title"><h2>Teslimat akışı</h2><span>Fiziksel stok yalnızca teslimatta düşer</span></div><div class="flow"><div class="step done"><i>✓</i>Rezervasyon</div><div class="connector"></div><div class="step done"><i>✓</i>Depo hazır</div><div class="connector"></div><div class="step current"><i>3</i>Servis atandı</div><div class="connector"></div><div class="step"><i>4</i>Teslim edildi</div></div></div><div class="table-wrap"><table><thead><tr><th>Rezervasyon</th><th>Müşteri</th><th>Ürün</th><th>Teslim tarihi</th><th>Durum</th><th>Aksiyon</th></tr></thead><tbody>${reservations.map(r=>`<tr><td><strong>${r.id}</strong></td><td>${r.customer}</td><td>${r.product}</td><td>${r.date}</td><td><span class="status ${r.status==="Teslim edildi"?"green":"amber"}">${r.status}</span></td><td>${r.status==="Teslim edildi"?"—":`<button class="btn ghost" data-deliver="${r.id}">Teslim edildi</button>`}</td></tr>`).join("")}</tbody></table></div>`}
    function stock(){return shell("Stok / Sayım","Fiziksel stok, açık rezervasyon ve sayım farklarını yönetin.","<button class=\"btn secondary\">+ Sayım başlat</button>")+`<div class="notice">Satılabilir stok = fiziksel stok − açık rezervasyon. Rezervasyon oluşturmak fiziksel stoğu değiştirmez.</div><div class="table-wrap"><table><thead><tr><th>Ürün</th><th>Fiziksel stok</th><th>Açık rezervasyon</th><th>Satılabilir</th><th>Sayım durumu</th></tr></thead><tbody>${products.map(p=>`<tr><td><strong>${p.name}</strong><br><small class="product-meta">${p.sku}</small></td><td>${p.stock}</td><td>${p.reserved}</td><td><strong>${p.stock-p.reserved}</strong></td><td><span class="status ${p.stock-p.reserved<2?"red":"green"}">${p.stock-p.reserved<2?"Temin ihtiyacı":"Uyumlu"}</span></td></tr>`).join("")}</tbody></table></div>`}
    function quick(){return shell("Hızlı Teslim","Code 128 değerini görselden okuyup tek bir müşteri kaydıyla doğrulayın; ürün veya WMS araması yapılmaz.","<span class=\"status blue\">Dosya / Ctrl+V</span>")+`<div class="grid dashboard-grid"><div class="card"><div class="section-title"><h2>1. Görüntüyü yükle</h2><span>Yalnızca Code 128</span></div><div class="form-field"><label>Barkod görüntüsü</label><input id="barcode" type="file" accept="image/*"><small class="product-meta">Dosya yükleyin veya görüntüyü Ctrl+V ile yapıştırın. Kamera, manuel kod ve görsel saklama MVP dışıdır.</small></div><button class="btn" style="margin-top:16px" data-action="scan">Code 128 çöz</button></div><div class="card"><div class="section-title"><h2>2. Müşteri ve doğrulama</h2></div><div class="form-grid"><div class="form-field full"><label>Müşteri ad-soyad</label><input placeholder="Ad Soyad"></div><div class="form-field full"><label>Telefon (isteğe bağlı)</label><input placeholder="05xx xxx xx xx"></div></div><div class="empty">Barkod değeri ile altındaki metin doğrulanır; tek kod ikinci kez kaydedilemez. WMS çıkışı bu uygulamada yapılmaz.</div></div></div>`}
    function settings(){return shell("Ayarlar","BayiOS çalışma alanı ve çıktı tercihleri.")+`<div class="grid dashboard-grid"><div class="card"><div class="section-title"><h2>Mağaza bilgileri</h2></div><div class="form-grid"><div class="form-field full"><label>Mağaza adı</label><input value="BayiHome Merkez"></div><div class="form-field"><label>Para birimi</label><select><option>Türk Lirası (TL)</option></select></div><div class="form-field"><label>Çıktı biçimi</label><select><option>A4</option></select></div></div><button class="btn">Kaydet</button></div><div class="card"><div class="section-title"><h2>Prototip sınırı</h2></div><p class="product-meta">Bu demo yerel mock state kullanır. Hesap, rol, backend ve internet bağlantısı gerektirmez.</p></div></div>`}
    function attachPageEvents(){
      document.querySelectorAll("[data-page]").forEach(b=>b.addEventListener("click",()=>render(b.dataset.page)));
      document.querySelectorAll("[data-product]").forEach(b=>b.addEventListener("click",()=>productModal(products.find(p=>p.id==b.dataset.product))));
      document.querySelectorAll("[data-deliver]").forEach(b=>b.addEventListener("click",()=>deliver(b.dataset.deliver)));
      const filter=document.getElementById("productFilter"); if(filter) filter.addEventListener("input",e=>{productFilter=e.target.value.toLowerCase();render("products");});
      document.querySelectorAll("[data-action='new-offer']").forEach(b=>b.addEventListener("click",offerModal));
      const scan=document.querySelector("[data-action='scan']"); if(scan) scan.addEventListener("click",()=>{document.getElementById("modalRoot").innerHTML=`<div class="modal-backdrop"><div class="modal"><div class="modal-head"><div><div class="eyebrow">Hızlı Teslim / Doğrulama</div><h2>Code 128 bulundu</h2></div><button class="close" data-close>×</button></div><p><strong>8690001234567</strong><br><span class="product-meta">Ürün/WMS araması yapılmaz · Tek kod / müşteri</span></p><div class="notice">Kod değiştirilmeden saklanır; kaydetmeden önce müşteri bilgisini doğrulayın.</div><div class="form-field"><label>Müşteri adı</label><input placeholder="Müşteri adı"><label>Telefon (isteğe bağlı)</label><input placeholder="Telefon"></div><div class="modal-actions" style="margin-top:20px"><button class="btn secondary" data-close>Vazgeç</button><button class="btn" data-close>Doğrula ve kaydet</button></div></div></div>`;closeModal();});
    }
    function productModal(p){document.getElementById("modalRoot").innerHTML=`<div class="modal-backdrop"><div class="modal"><div class="modal-head"><div><div class="eyebrow">${p.brand} · ${p.sku}</div><h2>${p.name}</h2></div><button class="close" data-close>×</button></div><div class="stock-highlight"><div><small>Satılabilir stok</small><br><strong>${p.stock-p.reserved} adet</strong></div><span class="status blue">${p.stock} fiziksel · ${p.reserved} açık rezervasyon</span></div><div class="form-grid"><div class="form-field"><label>Normal fiyat</label><input value="${p.price}" readonly></div><div class="form-field"><label>Oliz fiyatı</label><input value="23.999 TL" readonly></div></div><div class="modal-actions"><button class="btn secondary" data-close>Kapat</button><button class="btn" data-action="new-offer">Bu ürünle teklif oluştur</button></div></div></div>`;closeModal();document.querySelector("[data-action='new-offer']").addEventListener("click",offerModal);}
    function offerModal(){document.getElementById("modalRoot").innerHTML=`<div class="modal-backdrop"><div class="modal"><div class="modal-head"><div><div class="eyebrow">Yeni teklif</div><h2>Müşteri ve ürünleri ekle</h2></div><button class="close" data-close>×</button></div><div class="form-grid"><div class="form-field full"><label>Müşteri adı</label><input placeholder="Ad soyad veya kurum"></div><div class="form-field"><label>Ürün</label><select><option>Beyaz Seri 9 kg Çamaşır Makinesi</option><option>FreshCool No-Frost Buzdolabı</option></select></div><div class="form-field"><label>Adet</label><input type="number" value="1" min="1"></div><div class="form-field"><label>Ödeme</label><select><option>Nakit</option><option>Kart / 6 taksit</option></select></div><div class="form-field"><label>Teklif fiyatı</label><input value="24.999 TL"></div></div><div class="modal-actions"><button class="btn secondary" data-close>Vazgeç</button><button class="btn" data-save-offer>Teklifi kaydet</button></div></div></div>`;closeModal();document.querySelector("[data-save-offer]").addEventListener("click",()=>{document.getElementById("modalRoot").innerHTML="";view.insertAdjacentHTML("afterbegin",'<div class="notice">Teklif TK-2049 kaydedildi. Müşteri çıktısı maliyet ve kâr bilgilerini içermez.</div>');});}
    function closeModal(){document.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",()=>document.getElementById("modalRoot").innerHTML=""));}
    function deliver(id){const r=reservations.find(x=>x.id===id);if(!r)return;r.status="Teslim edildi";const p=products.find(x=>x.name===r.product);if(p&&p.stock>0)p.stock--;render("reservations");view.insertAdjacentHTML("afterbegin",'<div class="notice">Teslimat kaydedildi. Fiziksel stok bir adet azaltıldı; işlem idempotent demo davranışıdır.</div>');}
    render();
  </script>
</body>
</html>
